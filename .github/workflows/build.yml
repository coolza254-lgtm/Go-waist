# Tests the app, builds a signed release APK and publishes it as a GitHub Release.
name: Build APK

on:
  push:
    branches: [ ccr-db481057-xuhr75, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Stable signing key so each new APK installs over the previous one.
      # Preferred: repository secrets GOWAIST_KEYSTORE_BASE64 / GOWAIST_KEYSTORE_PASSWORD /
      # GOWAIST_KEY_ALIAS / GOWAIST_KEY_PASSWORD. Without them a cached debug key is used.
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gowaist-signing-debug-keystore-v1

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GOWAIST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GOWAIST_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Unit and UI tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build release APK
        env:
          GOWAIST_KEYSTORE_PASSWORD: ${{ secrets.GOWAIST_KEYSTORE_PASSWORD }}
          GOWAIST_KEY_ALIAS: ${{ secrets.GOWAIST_KEY_ALIAS }}
          GOWAIST_KEY_PASSWORD: ${{ secrets.GOWAIST_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GoWaist-$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/GoWaist.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: GoWaist-${{ env.VERSION_NAME }}
          path: dist/GoWaist-${{ env.VERSION_NAME }}.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" dist/GoWaist-$VERSION_NAME.apk dist/GoWaist.apk \
            --target "${{ github.sha }}" --latest \
            --title "Go waist $VERSION_NAME" \
            --notes "ดาวน์โหลด GoWaist.apk แล้วติดตั้งบน Android 8.0 ขึ้นไป (อนุญาต 'ติดตั้งแอปจากแหล่งที่ไม่รู้จัก' ครั้งแรก)"
          # The build-dependency cache is only for development containers.
          gh release delete deps-cache --yes --cleanup-tag || true
